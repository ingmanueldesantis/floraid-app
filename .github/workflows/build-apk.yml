name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p artifacts
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FloraID-Debug.apk
            echo "Debug APK pronto: artifacts/FloraID-Debug.apk"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloraID-Android-Debug-APK
          path: artifacts/FloraID-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attempt Build Release APK (Unsigned)
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../artifacts/FloraID-Release-Unsigned.apk
          fi

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FloraID-Android-Release-Unsigned-APK
          path: artifacts/FloraID-Release-Unsigned.apk
          if-no-files-found: warn
          retention-days: 30
